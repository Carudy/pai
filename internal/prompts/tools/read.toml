# Tool: read
#
#   name        identifier used in JSON responses and referenced by roles
#   brief       one-line summary, rendered in the compact per-turn reminder
#   description detailed prose, rendered once into the frozen system prompt
#   schema      the shape of the tool's `payload`
#
# The Go implementation is registered under this name in internal/role/tools.go.

name        = "read"
brief       = "read a text file, with line numbers"
description = '''
Read a text file from disk and return its contents with line numbers. Prefer it
over `cat`: it is bounded (offset/limit), refuses binary files, and numbers every
line so you can quote an exact "old_string" for the "edit" tool. Remove the
six-character line number and following tab when copying; keep the file's actual
indentation. CRLF is displayed as LF; an initial UTF-8 BOM is not displayed.

Read only the region you need. In a large file, locate the area first (e.g.
`rg -n <symbol>`), then read it with offset/limit instead of dumping the whole
file — a full read buries the lines you want and burns context.
Output stops at 2000 lines or the context.exec_limit byte budget (default 8000),
whichever comes first; only complete numbered lines are returned. Follow the
reported offset to continue, not offset plus the originally requested limit.
If the first selected line exceeds the budget, no partial line is returned:
use execute for a bounded targeted extraction or increase context.exec_limit.
The tool does not invent a total line count when it has not reached EOF.
Empty files are reported explicitly; an offset past EOF is an error. This tool
supports regular UTF-8 text files, not directories, devices, images, or PDFs.
'''
schema = '''
{
  "path":   "file path to read (required)",
  "offset": "1-based line to start at; default 1",
  "limit":  "max lines to return; default and hard maximum 2000; byte budget may stop earlier"
}
'''
