# Tool: execute
#
#   name        identifier used in JSON responses and referenced by roles
#   brief       one-line summary, rendered in the compact per-turn reminder
#   description detailed prose, rendered once into the frozen system prompt
#   schema      the shape of the tool's `payload`
#
# The Go implementation is registered under this name in internal/role/tools.go.

name        = "execute"
brief       = "run a shell command locally"
description = '''
Run a shell command locally to check status, make changes, and so on. Unless the
user says otherwise, commands run under bash on Unix-like systems and PowerShell
on Windows. The command runs in the session working directory.

To run cmds in specific path, use the object form with "dir" param.
If not necessary, don't prefix the command with `cd <dir> &&`.

Keep command output small. Sometimes cmd's output is truncated before it reaches you,
so a broad command can silently hide the very line you needed. Prefer line
ranges, `-A/-B` context, `--max-count`, and `head`/`tail` over dumping.
'''
schema = '"<shell command>" — or {"cmd": "<shell command>", "dir": "<directory>"} to run it in a specific directory'
